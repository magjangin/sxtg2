name: Logic tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic-tests:
    # 모드 본체는 게임 Managed DLL이 있어야 빌드되므로 여기서는 게임 없이 도는 순수 로직(BMS 파서·서든/히든 띠·설정 값 해석)만 검사한다.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run logic tests
        run: dotnet run --project sxtg2.LogicTests/sxtg2.LogicTests.csproj -c Release
